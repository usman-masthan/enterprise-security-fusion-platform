# Place this workflow file in each child repository at:
# .github/workflows/notify-umbrella.yml
#
# Whenever changes are merged to 'main' in this child repo,
# it automatically notifies the umbrella repository to pull the update and re-test!

name: Notify Umbrella Ecosystem

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dispatch-sync:
    name: Trigger Umbrella Repo Submodule Sync
    runs-on: ubuntu-latest
    steps:
      - name: Check if UMBRELLA_SYNC_TOKEN is configured
        id: check_token
        run: |
          if [ -n "${{ secrets.UMBRELLA_SYNC_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::UMBRELLA_SYNC_TOKEN secret is not yet configured in repository settings. Umbrella repo will synchronize automatically via its scheduled hourly workflow."
          fi

      - name: Dispatch Update Event to Umbrella Repo
        if: steps.check_token.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.UMBRELLA_SYNC_TOKEN }}
          repository: usman-masthan/enterprise-security-fusion-platform
          event-type: submodule-update
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "repo": "${{ github.repository }}"}'
